[package]
name = "embedded-test-macros"
description = "proc-macros for the embedded-test crate"
version = "0.8.2"
edition = "2021"
repository = "https://github.com/probe-rs/embedded-test"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.79"
quote = "1.0.35"
syn = { version = "3.0.3", features = ["extra-traits", "full"] }
darling = "0.24.0"

[features]
embassy = [] # any embassy version selected
embassy-09 = ["embassy"]
embassy-010 = ["embassy"]
external-executor = ["embassy"]
ariel-os = []
std = []
