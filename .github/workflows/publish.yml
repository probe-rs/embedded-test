# Manually triggered publishing of a crate from this repo to crates.io, using
# crates.io Trusted Publishing (OIDC) instead of a long-lived API token.
#
# There is no CARGO_REGISTRY_TOKEN secret: rust-lang/crates-io-auth-action exchanges this
# workflow's GitHub OIDC identity for a short-lived crates.io token that is revoked again
# when the job finishes.
#
# One-time setup per crate, on https://crates.io/crates/<crate>/settings/trusted-publishing:
#   Repository owner: probe-rs
#   Repository name:  embedded-test
#   Workflow name:    publish.yml
#   Environment:      crates-io
# The environment name must match the `environment:` value below exactly, or crates.io rejects
# the token exchange. A crate must be published manually once before trusted publishing can be
# configured for it.
#
# The `crates-io` environment should be configured (Settings > Environments) with required
# reviewers, so publishing needs their approval even from someone with repo write access.

name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      crate:
        description: Crate to publish, at the version currently in its Cargo.toml
        required: true
        type: choice
        options:
          - embedded-test
          - embedded-test-macros
          - embedded-test-linker-script
      dry_run:
        description: Package and verify the crate without uploading it
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # Required to mint the crates.io OIDC token.

jobs:
  publish:
    name: Publish ${{ inputs.crate }}
    runs-on: ubuntu-latest
    # Gate releases behind an environment so protection rules (required reviewers) apply, and
    # so the OIDC claim matches the trusted publisher configured on crates.io.
    environment: crates-io
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Resolve manifest path
        id: resolve
        run: |
          case "${{ inputs.crate }}" in
            embedded-test) echo "manifest=Cargo.toml" >> "$GITHUB_OUTPUT" ;;
            embedded-test-macros) echo "manifest=macros/Cargo.toml" >> "$GITHUB_OUTPUT" ;;
            embedded-test-linker-script) echo "manifest=linker-script/Cargo.toml" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown crate '${{ inputs.crate }}'" && exit 1 ;;
          esac

      - name: Package and verify
        run: cargo publish --manifest-path "${{ steps.resolve.outputs.manifest }}" --dry-run

      - name: Get crates.io token
        if: ${{ !inputs.dry_run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: cargo publish --manifest-path "${{ steps.resolve.outputs.manifest }}" --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
